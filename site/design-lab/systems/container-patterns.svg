<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="patterns-t patterns-d">
<title id="patterns-t">Six container configurations and a door-shelter detail</title>
<desc id="patterns-d">Original schematic diagrams: one container with a shallow entry shelter and open door-leaf shutters; two staggered containers with a covered gap; an L-shaped pair around a deck; a stacked pair; a cantilevered upper container; and a secure entry porch with shutters. These are planning diagrams, not engineered structures.</desc>
<rect width="1000" height="390" fill="#faf8f2"/>
<text x="10" y="386" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Original schematic · Containers Hamlet Design Lab · CC BY-SA 4.0</text>
<g transform="translate(10,10)"><rect width="300" height="165" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d392c">Single + door shelter</text><rect x="72" y="62" width="110" height="56" fill="#8a6a4a" stroke="#274c3b"/><path d="M72 62h110v-18H72z" fill="#3d6654" stroke="#274c3b"/><path d="M64 44h126" stroke="#e5b21c" stroke-width="4"/><path d="M82 44v18M182 44v18" stroke="#5d6f6a" stroke-width="3"/><text x="72" y="130" font-size="8" fill="#3f5a4c">canopy + open shutters</text><text x="14" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#4f5f53">Concept only · engineering and permit review required</text></g>
<g transform="translate(340,10)"><rect width="300" height="165" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d392c">Staggered pair / dogtrot</text><rect x="50" y="58" width="130" height="50" fill="#8a6a4a" stroke="#274c3b"/><rect x="132" y="104" width="130" height="50" fill="#8a6a4a" stroke="#274c3b"/><rect x="120" y="82" width="72" height="42" fill="#d9c7a5" stroke="#274c3b" stroke-dasharray="4 3"/><text x="50" y="130" font-size="8" fill="#3f5a4c">cross-ventilated gap</text><text x="14" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#4f5f53">Concept only · engineering and permit review required</text></g>
<g transform="translate(670,10)"><rect width="300" height="165" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d392c">L-shape / courtyard</text><rect x="60" y="56" width="120" height="52" fill="#8a6a4a" stroke="#274c3b"/><rect x="148" y="92" width="52" height="64" fill="#8a6a4a" stroke="#274c3b"/><path d="M60 108h88v48H60z" fill="#d9c7a5" fill-opacity=".55" stroke="#7b8b73" stroke-dasharray="4 3"/><text x="60" y="130" font-size="8" fill="#3f5a4c">sheltered court</text><text x="14" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#4f5f53">Concept only · engineering and permit review required</text></g>
