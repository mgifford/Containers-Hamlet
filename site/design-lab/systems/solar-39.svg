<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="system-solar-39-t system-solar-39-d"><title id="system-solar-39-t">Solar tilt · 39°</title><desc id="system-solar-39-d">Explanatory section of a roof-mounted solar array tilted 39 degrees, facing azimuth 180 degrees. Conceptual only; snow shedding, shading, wind uplift, roof structure and electrical design need professional review.</desc><rect width="1040" height="400" fill="#faf8f2"/><text x="34" y="44" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#1d392c">Solar tilt · 39°</text><text x="34" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#3f5a4c">m1 · 39° tilt · 180° azimuth · year-round strategy</text><line x1="120" y1="270" x2="900" y2="270" stroke="#253a33" stroke-width="3"/><rect x="120" y="270" width="780" height="42" fill="#e9e2ce" stroke="#7d8b73"/><text x="132" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#3f5a4c">container roof / structure</text><line x1="280" y1="270" x2="490" y2="99.94535302904853" stroke="#245a73" stroke-width="8"/><line x1="280" y1="282" x2="490" y2="111.94535302904853" stroke="#9fc9d6" stroke-width="2"/><line x1="280" y1="270" x2="280" y2="292" stroke="#536b63" stroke-width="2"/><line x1="490" y1="99.94535302904853" x2="490" y2="121.94535302904853" stroke="#536b63" stroke-width="2"/><line x1="280" y1="270" x2="280" y2="270" stroke="#536b63" stroke-width="2" stroke-dasharray="4 3"/><line x1="490" y1="99.94535302904853" x2="490" y2="270" stroke="#536b63" stroke-width="2" stroke-dasharray="4 3"/><text x="290" y="87.94535302904853" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#245a73">solar array</text><path d="M340 270 A60 60 0 0 0 326.6 232.2" fill="none" stroke="#b45e1c" stroke-width="2"/><text x="346" y="260" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#b45e1c">39°</text><line x1="610" y1="200" x2="610" y2="300" stroke="#3f5f8a" stroke-width="2" stroke-dasharray="5 4"/><text x="616" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#3f5f8a">azimuth 180°</text><text x="34" y="344" font-family="system-ui, sans-serif" font-size="12" fill="#1d392c">Year-round 36–39° · winter ~60° for low sun and snow shedding · summer ~30° · face true south within a few degrees.</text><text x="34" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#3f5a4c">Ottawa reference: SolarCalculator.CA reports 39° optimal fixed tilt. No energy production, snow-shedding or code compliance is claimed.</text><text x="34" y="388" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Conceptual solar section · roof structure, wind uplift, shading, snow and electrical design require professional review · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>