<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="system-foundation-helical-piles-t system-foundation-helical-piles-d"><title id="system-foundation-helical-piles-t">Foundation · helical-piles</title><desc id="system-foundation-helical-piles-d">Conceptual elevated foundation section: Engineered helical piles, 0.6 metre clearance, no slab, no fill and no compaction. Piles, frost depth, uplift, corrosion, lateral capacity and permits require professional design.</desc><rect width="1040" height="430" fill="#faf8f2"/><text x="34" y="42" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#1d392c">Foundation · helical-piles</text><text x="34" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#3f5a4c">Engineered helical piles · 0.6 m clearance · independent deck: yes · no compaction: yes</text><rect x="70" y="210" width="760" height="200" fill="#e4e9dd"/><line x1="70" y1="210" x2="830" y2="210" stroke="#6f7b63" stroke-width="2"/><text x="82" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#3f5a4c">existing grade · no fill · no compaction</text><rect x="180" y="135" width="500" height="22" fill="#8a6a4a" stroke="#3a342d" stroke-width="1.2"/><text x="190" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d392c">elevated floor / independent deck</text><line x1="230" y1="135" x2="230" y2="370" stroke="#5d6f6a" stroke-width="7"/><rect x="212" y="147" width="36" height="10" fill="#455955"/><path d="M212 358h36l-10 12h-16z" fill="#455955"/><path d="M214 366q16 18 32 0" fill="none" stroke="#455955" stroke-width="3"/><line x1="370" y1="135" x2="370" y2="370" stroke="#5d6f6a" stroke-width="7"/><rect x="352" y="147" width="36" height="10" fill="#455955"/><path d="M352 358h36l-10 12h-16z" fill="#455955"/><path d="M354 366q16 18 32 0" fill="none" stroke="#455955" stroke-width="3"/><line x1="510" y1="135" x2="510" y2="370" stroke="#5d6f6a" stroke-width="7"/><rect x="492" y="147" width="36" height="10" fill="#455955"/><path d="M492 358h36l-10 12h-16z" fill="#455955"/><path d="M494 366q16 18 32 0" fill="none" stroke="#455955" stroke-width="3"/><line x1="650" y1="135" x2="650" y2="370" stroke="#5d6f6a" stroke-width="7"/><rect x="632" y="147" width="36" height="10" fill="#455955"/><path d="M632 358h36l-10 12h-16z" fill="#455955"/><path d="M634 366q16 18 32 0" fill="none" stroke="#455955" stroke-width="3"/><line x1="70" y1="300" x2="830" y2="300" stroke="#8f5a21" stroke-width="1.5" stroke-dasharray="6 4"/><text x="82" y="294" font-family="system-ui, sans-serif" font-size="11" fill="#8f5a21">frost depth to be confirmed · pile depth and uplift engineered</text><path d="M760 210 C720 180 700 150 735 120 C760 100 800 130 800 160" fill="none" stroke="#3f704b" stroke-width="2"/><text x="738" y="104" font-family="system-ui, sans-serif" font-size="10" fill="#31573f">root protection zone</text><text x="34" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#1d392c">Point loads, no slab, no fill and no grade change. Matting and an arborist-reviewed sequence protect roots during construction.</text><text x="34" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#3f5a4c">Geotechnical review, frost uplift, corrosion, lateral capacity, slope stability, building permit and conservation-authority approval are required.</text><text x="34" y="422" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Conceptual foundation section · not a construction detail · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>