x="34" y="428" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c"><tspan font-weight="800">3.</tspan> exterior closed-cell spray foam (protected, fire-reviewed) · 100 mm · insulation</text><text x="34" y="449" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c"><tspan font-weight="800">4.</tspan> continuous thermal break / insulation · 10 mm · thermal break</text><text x="34" y="470" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c"><tspan font-weight="800">5.</tspan> ventilated drained cavity · 25 mm · rainscreen</text><text x="34" y="491" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c"><tspan font-weight="800">6.</tspan> mixed cladding · 20 mm · cladding</text><g font-family="system-ui, sans-serif" font-size="10.5" fill="#3f5a4c"><text x="34" y="522">• Condensation: air/vapour control, thermal breaks, ventilation and drying need a building-envelope review.</text><text x="34" y="537">• Fire: insulation, cladding and cavity need a fire review; do not assume this assembly is acceptable.</text><text x="34" y="552">• Moisture: drained/ventilated rainscreen and ground clearance need detailing; planting adds water and load.</text><text x="34" y="567">• Fastening/penetrations: long fasteners, cladding rails and planter brackets need structural and waterproofing review.</text><text x="34" y="582">• Maintenance: inspect cladding, sealant, cavity, fasteners and vegetation regularly.</text></g><text x="34" y="628" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Conceptual wall section · not a construction detail · not code-compliant or moisture-safe without engineering review · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>