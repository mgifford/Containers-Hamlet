<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="storey-t storey-d">
<title id="storey-t">Three conceptual two-storey container options</title>
<desc id="storey-d">Original schematic sections: a stacked pair with an external stair, an offset stack with a set-back upper container, and a hillside two-level home with grade entry on the uphill side. Each shows structure, stair/egress and foundation questions. These are not engineered buildings.</desc>
<rect width="1000" height="390" fill="#faf8f2"/>
<g transform="translate(10,0)"><rect x="0" y="54" width="300" height="300" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d392c">Stacked pair + external stair</text><rect x="74" y="160" width="150" height="72" fill="#8a6a4a" stroke="#274c3b" stroke-width="2"/><rect x="74" y="88" width="150" height="72" fill="#9a7a58" stroke="#274c3b" stroke-width="2"/><path d="M224 160h18v72h-18M224 88h18v72h-18" fill="none" stroke="#5d6f6a" stroke-width="4"/><path d="M242 160h30v84h-30M272 244l-22 18M250 262l-22 18" fill="none" stroke="#9a4e3a" stroke-width="3"/><text x="74" y="314" font-size="8" fill="#3f5a4c">vertical load path · two exits · fire separation</text></g>
<g transform="translate(340,0)"><rect x="0" y="54" width="300" height="300" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d392c">Offset stack / cantilever</text><rect x="392" y="174" width="160" height="62" fill="#8a6a4a" stroke="#274c3b" stroke-width="2"/><rect x="430" y="96" width="130" height="64" fill="#9a7a58" stroke="#274c3b" stroke-width="2"/><path d="M430 160v-8M560 160v-8" stroke="#9a4e3a" stroke-width="4"/><path d="M552 174h42v50" fill="none" stroke="#5d6f6a" stroke-width="4"/><path d="M552 224h42" stroke="#5d6f6a" stroke-width="4"/><text x="392" y="314" font-size="8" fill="#3f5a4c">overturning · back-span · protected stair</text></g>
<g transform="translate(670,0)"><rect x="0" y="54" width="300" height="300" rx="10" fill="#f7f5ed" stroke="#b9c4b3"/><text x="14" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d392c">Hillside two-level</text><path d="M712 230l70-72 92 72" fill="#d7e3cd" stroke="#6d8c6b"/><rect x="746" y="186" width="128" height="58" fill="#8a6a4a" stroke="#274c3b" stroke-width="2"/><rect x="776" y="228" width="128" height="58" fill="#9a7a58" stroke="#274c3b" stroke-width="2"/><path d="M746 186h128M776 228h128" stroke="#17392e" stroke-width="1.5"/><path d="M746 244h30v-58M806 244v-58" stroke="#5d6f6a" stroke-width="3"/><text x="712" y="314" font-size="8" fill="#3f5a4c">grade entry · retaining · downhill egress</text></g>
