<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="concept-micro-studio-section-t concept-micro-studio-section-d"><title id="concept-micro-studio-section-t">Micro Studio · building section</title><desc id="concept-micro-studio-section-d">Concept building section through Micro Studio at 0 metres, generated from the same module geometry, levels and roof as the plans and elevations. It shows floor levels, modules, no stair, the roof profile and the ground. Conceptual only; not a structural or construction section.</desc><rect width="1040" height="720" fill="#faf8f2"/><text x="32" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d392c">Micro Studio · building section</text><text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#3f5a4c">Cut at 0 m · 1 occupied storey · 3.8 m to roof</text><rect x="0" y="624" width="1040" height="96" fill="#e8ecdf"/><line x1="20" y1="624" x2="1020" y2="624" stroke="#6f7b63" stroke-width="2.5"/><rect x="199.2" y="269" width="641.5" height="294.1" fill="#2f7d5f" fill-opacity="0.82" stroke="#253a33" stroke-width="2" /><text x="520" y="577.1" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1d392c" stroke="#faf8f2" stroke-width="2.2" paint-order="stroke">m1 · L1</text><text x="303.8" y="547.7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#3f5a4c" stroke="#faf8f2" stroke-width="2" paint-order="stroke">Bathroom</text><text x="486.6" y="547.7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#3f5a4c" stroke="#faf8f2" stroke-width="2" paint-order="stroke">Kitchenette</text><text x="699.8" y="547.7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#3f5a4c" stroke="#faf8f2" stroke-width="2" paint-order="stroke">Sleeping and living</text><path d="M151.5 256.8L888.5 256.8L888.5 238.6L151.5 238.6Z" fill="#245244" fill-opacity="0.95" stroke="#17392e" stroke-width="2"/><line x1="24" y1="563.1" x2="910" y2="563.1" stroke="#8f5a21" stroke-width="1" stroke-dasharray="6 4"/><text x="28" y="558.1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8f5a21">Ground floor +0.6 m</text><line x1="988" y1="624" x2="988" y2="238.6" stroke="#435a4a" stroke-width="1.2"/><text x="982" y="431.3" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">3.8 m</text><text x="32" y="704" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept section · floor levels, modules, stair and roof are generated from one model · not for construction · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>