<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="concept-hamlet-offset-stack-solar-summer-t concept-hamlet-offset-stack-solar-summer-d"><title id="concept-hamlet-offset-stack-solar-summer-t">Offset Pair · summer solar study</title><desc id="concept-hamlet-offset-stack-solar-summer-d">Concept summer solar study for Offset Pair. A 65 degree sun altitude is shown against the south facade, roof overhang and glazing. It is a qualitative shading diagram, not an energy, daylight, glare or overheating calculation.</desc><rect width="1040" height="520" fill="#faf8f2"/><text x="32" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d392c">Offset Pair · summer solar study</text><text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#3f5a4c">South-facing section · sun altitude about 65° · overhang 0.7 m · qualitative shading only</text><rect x="0" y="424" width="1040" height="96" fill="#e8ecdf"/><line x1="20" y1="424" x2="1020" y2="424" stroke="#6f7b63" stroke-width="2.5"/><rect x="90" y="238.3" width="860" height="185.7" fill="#9a7350" stroke="#253a33" stroke-width="2"/><rect x="563" y="296.5" width="301" height="85" fill="#9fd3e0" stroke="#2d3a35" stroke-width="1.6"/><path d="M90 231.9L950 231.9L950 191.5L90 191.5Z" fill="#245244" stroke="#17392e" stroke-width="2"/><circle cx="40" cy="100" r="14" fill="#e5b21c" stroke="#8f5a21" stroke-width="2"/><text x="62" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#8f5a21">65° sun</text><line x1="40" y1="100" x2="302" y2="661.9" stroke="#e5b21c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="90" y="191.5" width="860" height="46.8" fill="#3f5a4c" fill-opacity="0.22"/><text x="1008" y="456" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">Summer: the overhang should shade high sun; west glazing needs a separate strategy.</text><text x="32" y="486" font-family="system-ui, sans-serif" font-size="10" fill="#3f5a4c">No energy production, overheating, daylight or glare result is calculated. Confirm with a whole-building energy and shading model.</text><text x="32" y="506" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept solar study · schematic · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>