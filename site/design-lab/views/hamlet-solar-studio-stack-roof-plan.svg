2c"/><text x="996" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="#1d392c">N</text></g><text x="30" y="706" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept roof plan · roof geometry is independent of the occupied storeys · drainage, snow, wind and structure need review · CC BY-SA 4.0</text></svg>