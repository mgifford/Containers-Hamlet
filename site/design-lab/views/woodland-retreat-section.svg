-ui, sans-serif" font-size="8.5" fill="#3f5a4c" stroke="#faf8f2" stroke-width="2" paint-order="stroke">Living</text><path d="M96 395L944 395L944 383.6L96 383.6Z" fill="#245244" fill-opacity="0.95" stroke="#17392e" stroke-width="2"/><line x1="24" y1="586" x2="910" y2="586" stroke="#8f5a21" stroke-width="1" stroke-dasharray="6 4"/><text x="28" y="581" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8f5a21">Ground floor +0.6 m</text><line x1="988" y1="624" x2="988" y2="383.6" stroke="#435a4a" stroke-width="1.2"/><text x="982" y="503.8" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">3.8 m</text><text x="32" y="704" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept section · floor levels, modules, stair and roof are generated from one model · not for construction · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>