ng</text><text x="814.9" y="588.1" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#3f5a4c" stroke="#faf8f2" stroke-width="2" paint-order="stroke">Living</text><rect x="113.3" y="435.4" width="151" height="156.3" fill="#6f5a41" fill-opacity="0.82" stroke="#253a33" stroke-width="2" /><text x="188.8" y="605.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1d392c" stroke="#faf8f2" stroke-width="2.2" paint-order="stroke">m2 · L1</text><path d="M96 428.9L944 428.9L944 419.2L96 419.2Z" fill="#245244" fill-opacity="0.95" stroke="#17392e" stroke-width="2"/><line x1="933.4" y1="624" x2="933.4" y2="489.1" stroke="#5d6f6a" stroke-width="3"/><line x1="1257.2" y1="624" x2="1257.2" y2="489.1" stroke="#5d6f6a" stroke-width="3"/><rect x="933.4" y="482.6" width="323.8" height="6.5" fill="#6d5b49" stroke="#4f4337" stroke-width="1.2"/><rect x="267.7" y="369.3" width="504.6" height="40.2" fill="#245a73" fill-opacity="0.18" stroke="#123b4d" stroke-width="1.4" stroke-dasharray="7 4"/><text x="520" y="403.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#123b4d">12 panels beyond the cut · shown dashed</text><line x1="24" y1="591.6" x2="910" y2="591.6" stroke="#8f5a21" stroke-width="1" stroke-dasharray="6 4"/><text x="28" y="586.6" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8f5a21">Ground floor +0.6 m</text><line x1="988" y1="624" x2="988" y2="419.2" stroke="#435a4a" stroke-width="1.2"/><text x="982" y="521.6" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">3.8 m</text><text x="32" y="704" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept section · floor levels, modules, stair and roof are generated from one model · not for construction · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>