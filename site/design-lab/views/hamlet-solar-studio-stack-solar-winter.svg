<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="concept-hamlet-solar-studio-stack-solar-winter-t concept-hamlet-solar-studio-stack-solar-winter-d"><title id="concept-hamlet-solar-studio-stack-solar-winter-t">Solar Studio Stack · winter solar study</title><desc id="concept-hamlet-solar-studio-stack-solar-winter-d">Concept winter solar study for Solar Studio Stack. A 20 degree sun altitude is shown against the south facade, roof overhang, glazing and the installed south-facing panels. The panel divisions match the canonical array count. It is a qualitative shading diagram; monthly energy estimates are published separately.</desc><rect width="1040" height="520" fill="#faf8f2"/><text x="32" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d392c">Solar Studio Stack · winter solar study</text><text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#3f5a4c">South-facing section · sun altitude about 20° · overhang 0.9 m · qualitative shading only</text><rect x="0" y="424" width="1040" height="96" fill="#e8ecdf"/><line x1="20" y1="424" x2="1020" y2="424" stroke="#6f7b63" stroke-width="2.5"/><rect x="317.4" y="106.2" width="405.2" height="317.8" fill="#9a7350" stroke="#253a33" stroke-width="2"/><rect x="540.3" y="311.7" width="141.8" height="74.9" fill="#9fd3e0" stroke="#2d3a35" stroke-width="1.6"/><path d="M317.4 100.5L722.6 100.5L722.6 64L317.4 64Z" fill="#245244" stroke="#17392e" stroke-width="2"/><path d="M536.2 94.9L560.5 94.9L560.5 55.1L536.2 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M560.5 94.9L584.8 94.9L584.8 55.1L560.5 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M584.8 94.9L609.1 94.9L609.1 55.1L584.8 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M609.1 94.9L633.4 94.9L633.4 55.1L609.1 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M633.4 94.9L657.8 94.9L657.8 55.1L633.4 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M657.8 94.9L682.1 94.9L682.1 55.1L657.8 55.1Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><text x="609.1" y="88.9" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#123b4d">pv-a · 6 panels at 40°</text><path d="M511.9 90.2L548.4 90.2L548.4 50.5L511.9 50.5Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M548.4 90.2L584.8 90.2L584.8 50.5L548.4 50.5Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M584.8 90.2L621.3 90.2L621.3 50.5L584.8 50.5Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M621.3 90.2L657.8 90.2L657.8 50.5L621.3 50.5Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><text x="584.8" y="84.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#123b4d">pv-b · 4 panels at 65°</text><circle cx="40" cy="100" r="14" fill="#e5b21c" stroke="#8f5a21" stroke-width="2"/><text x="62" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#8f5a21">20° sun</text><line x1="40" y1="100" x2="622.6" y2="312.1" stroke="#e5b21c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="317.4" y="64" width="405.2" height="15.3" fill="#3f5a4c" fill-opacity="0.22"/><text x="1008" y="456" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">Winter: low sun should reach the glazing; snow shedding and glare need review.</text><text x="32" y="486" font-family="system-ui, sans-serif" font-size="10" fill="#3f5a4c">No energy production, overheating, daylight or glare result is calculated. Confirm with a whole-building energy and shading model.</text><text x="32" y="506" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept solar study · schematic · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>