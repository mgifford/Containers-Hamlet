<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="concept-hamlet-woodland-cottage-solar-winter-t concept-hamlet-woodland-cottage-solar-winter-d"><title id="concept-hamlet-woodland-cottage-solar-winter-t">Woodland Cottage · winter solar study</title><desc id="concept-hamlet-woodland-cottage-solar-winter-d">Concept winter solar study for Woodland Cottage. A 20 degree sun altitude is shown against the south facade, roof overhang, glazing and the installed south-facing panels. The panel divisions match the canonical array count. It is a qualitative shading diagram; monthly energy estimates are published separately.</desc><rect width="1040" height="520" fill="#faf8f2"/><text x="32" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d392c">Woodland Cottage · winter solar study</text><text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#3f5a4c">South-facing section · sun altitude about 20° · overhang 0.8 m · qualitative shading only</text><rect x="0" y="424" width="1040" height="96" fill="#e8ecdf"/><line x1="20" y1="424" x2="1020" y2="424" stroke="#6f7b63" stroke-width="2.5"/><rect x="90" y="206" width="860" height="218" fill="#9a7350" stroke="#253a33" stroke-width="2"/><rect x="563" y="274.3" width="301" height="99.8" fill="#9fd3e0" stroke="#2d3a35" stroke-width="1.6"/><path d="M90 198.5L950 198.5L950 150L90 150Z" fill="#245244" stroke="#17392e" stroke-width="2"/><path d="M554.4 191L593.1 191L593.1 138L554.4 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M593.1 191L631.8 191L631.8 138L593.1 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M631.8 191L670.5 191L670.5 138L631.8 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M670.5 191L709.2 191L709.2 138L670.5 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M709.2 191L747.9 191L747.9 138L709.2 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M747.9 191L786.6 191L786.6 138L747.9 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M786.6 191L825.3 191L825.3 138L786.6 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><path d="M825.3 191L864 191L864 138L825.3 138Z" fill="#123b4d" stroke="#eaf6f9" stroke-width="0.7"/><text x="709.2" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#123b4d">pv-a · 8 panels at 24°</text><circle cx="40" cy="100" r="14" fill="#e5b21c" stroke="#8f5a21" stroke-width="2"/><text x="62" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#8f5a21">20° sun</text><line x1="40" y1="100" x2="622.6" y2="312.1" stroke="#e5b21c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="90" y="150" width="860" height="18.2" fill="#3f5a4c" fill-opacity="0.22"/><text x="1008" y="456" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#1d392c">Winter: low sun should reach the glazing; snow shedding and glare need review.</text><text x="32" y="486" font-family="system-ui, sans-serif" font-size="10" fill="#3f5a4c">No energy production, overheating, daylight or glare result is calculated. Confirm with a whole-building energy and shading model.</text><text x="32" y="506" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept solar study · schematic · Containers Hamlet Design Lab · CC BY-SA 4.0</text></svg>