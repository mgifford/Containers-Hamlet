<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="concept-hamlet-woodland-cottage-roof-plan-t concept-hamlet-woodland-cottage-roof-plan-d" data-drawing="roof-plan"><title id="concept-hamlet-woodland-cottage-roof-plan-t">Woodland Cottage · roof plan</title><desc id="concept-hamlet-woodland-cottage-roof-plan-d">Concept roof plan for Woodland Cottage. gable roof at 24 degrees, 0.8 m overhang. The roof outline, ridge/valley and slope arrows are generated from the same roof geometry as the elevations and section. Conceptual only; drainage, snow, wind and structure need review.</desc><rect width="1040" height="720" fill="#faf8f2"/><text x="30" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#1d392c">Woodland Cottage · roof plan</text><text x="30" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#3f5a4c">gable roof · 24° pitch · 0.8 m overhang · 61 m² roof area</text><path d="M141.7 284.3L898.3 284.3L898.3 435.7L141.7 435.7Z" fill="none" stroke="#8a9a83" stroke-width="1.2" stroke-dasharray="6 4"/><path d="M92 234.7L948 234.7L948 485.3L92 485.3Z" fill="#245244" fill-opacity="0.16" stroke="#245244" stroke-width="2.2"/><line x1="92" y1="360" x2="948" y2="360" stroke="#245244" stroke-width="2.4" /><text x="100" y="352" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8f5a21">ridge</text><line x1="263.2" y1="448.1" x2="776.8" y2="448.1" stroke="#245a73" stroke-width="2.2"/><text x="263.2" y="440.1" font-family="system-ui, sans-serif" font-size="10" fill="#245a73">slope / drainage direction</text><path d="M263.2 284.8L776.8 284.8L776.8 372.5L263.2 372.5Z" fill="#245a73" fill-opacity="0.28" stroke="#123b4d" stroke-width="1.4" stroke-dasharray="5 3"/><text x="520" y="328.7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#123b4d">PV array intent</text><g aria-hidden="true"><circle cx="996" cy="44" r="23" fill="#fffdf7" stroke="#b9c3b2"/><path d="M996 27l6 32l-6 -8l-6 8z" fill="#1d392c"/><text x="996" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="#1d392c">N</text></g><text x="30" y="706" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept roof plan · roof geometry is independent of the occupied storeys · drainage, snow, wind and structure need review · CC BY-SA 4.0</text></svg>