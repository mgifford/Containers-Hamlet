text x="520" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#123b4d">PV array intent</text><g aria-hidden="true"><circle cx="996" cy="44" r="23" fill="#fffdf7" stroke="#b9c3b2"/><path d="M996 27l6 32l-6 -8l-6 8z" fill="#1d392c"/><text x="996" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="#1d392c">N</text></g><text x="30" y="706" font-family="system-ui, sans-serif" font-size="9" fill="#5e6a58">Concept roof plan · roof geometry is independent of the occupied storeys · drainage, snow, wind and structure need review · CC BY-SA 4.0</text></svg>