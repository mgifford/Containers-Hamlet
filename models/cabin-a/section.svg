<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Conceptual envelope section</title><desc id="d">Schematic layers showing container steel, continuous external insulation, ventilated cavity, and timber rainscreen. Not a specified building assembly.</desc><rect width="1000" height="620" fill="#faf8f2"/><text x="50" y="55" font-family="Arial" font-size="28" fill="#203a2b" font-weight="bold">ENVELOPE CONCEPT | SECTION</text><text x="50" y="85" font-family="Arial" font-size="17" fill="#203a2b">Diagram only. Assembly, fire, moisture and code compliance must be designed.</text><g><rect x="130" y="145" width="50" height="340" fill="#7a8a91"/><rect x="180" y="145" width="140" height="340" fill="#e7c98c"/><rect x="320" y="145" width="50" height="340" fill="#cfe4d8"/><rect x="370" y="145" width="45" height="340" fill="#b48a5b"/></g><g font-family="Arial" font-size="19" fill="#21382c"><text x="465" y="195">Steel container shell</text><path d="M180 190h270" stroke="#21382c" stroke-width="2"/><text x="465" y="270">Continuous external insulation (type TBD)</text><path d="M250 265h200" stroke="#21382c" stroke-width="2"/><text x="465" y="345">Ventilated cavity / weather control (TBD)</text><path d="M345 340h105" stroke="#21382c" stroke-width="2"/><text x="465" y="420">Replaceable timber rainscreen</text><path d="M415 415h35" stroke="#21382c" stroke-width="2"/><text x="130" y="525" font-size="15">Interior</text><text x="370" y="525" font-size="15">Exterior</text><text x="50" y="580" font-size="15">Air, vapour, thermal bridge and fastening details are intentionally unspecified. Selective spray foam requires separate assessment.</text></g></svg>